name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release pipeline runs the same checks on the release tag.
  workflow_call:
    inputs:
      skip-package:
        description: Skip the package smoke test (the release pipeline tests its own build instead)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so a release never cancels (or is
  # cancelled by) CI for the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Smoke-test the CLI
        run: |
          node dist/src/cli.js --version
          node dist/src/cli.js help

  package:
    name: Package · ${{ matrix.os }}
    if: ${{ !inputs.skip-package }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm pack
      - name: Check the changelog is ready for the release tooling
        if: runner.os == 'Linux'
        run: node dist/scripts/release.js check
      - name: Install the tarball globally, then install into 18 tools, start the server through each config, uninstall
        shell: bash
        run: node dist/scripts/smoke.js --tarball codex-imagegen-mcp-*.tgz
